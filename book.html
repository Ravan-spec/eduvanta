<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Mode | EDUVANTA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f4f6ff;font-family:Arial,sans-serif;line-height:1.7}
header{position:sticky;top:0;background:#111a2e;border-bottom:1px solid #293653;padding:13px 17px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.logo{font-size:21px;font-weight:bold;color:#91a4ff}
.back{background:#26334f;color:white;text-decoration:none;padding:8px 13px;border-radius:9px}
main{max-width:850px;margin:25px auto;padding:0 16px 50px}
.info{color:#aab4ca;font-size:14px}
h1{font-size:27px;line-height:1.3}
h2{color:#aebcff;border-bottom:1px solid #344568;padding-bottom:8px}
h3{color:#d3dcff;margin-top:28px}
.content{background:#151e33;border:1px solid #293653;border-radius:16px;padding:22px}
.content p{margin:10px 0}
li{margin:7px 0}
.formula{background:#202c47;padding:12px 15px;border-left:3px solid #91a4ff;border-radius:7px;overflow-wrap:anywhere}
.notice{background:#332d1d;color:#ffe5a3;padding:13px;border-radius:10px;margin-top:22px}
@media(max-width:500px){h1{font-size:23px}.content{padding:16px}}
</style>
</head>
<body>

<header>
<div class="logo">EDUVANTA</div>
<a class="back" id="backButton" href="#">← Back</a>
</header>

<main>
<p class="info" id="courseInfo"></p>
<h1 id="pageTitle">Book Mode</h1>
<p class="info">Read concepts, understand formulas and revise important points.</p>

<article class="content" id="bookContent"></article>
</main>

<script>
const params=new URLSearchParams(location.search);
const selectedClass=params.get("class")||"Class 12";
const board=params.get("board")||"CBSE";
const subject=params.get("subject")||"Physics";
const chapter=params.get("chapter")||"Electric Charges and Fields";
const number=Number(params.get("number")||1);

document.getElementById("courseInfo").textContent=
board+" • "+selectedClass+" • "+subject+" • Chapter "+number;

document.getElementById("pageTitle").textContent="📖 "+chapter;

document.getElementById("backButton").onclick=function(event){
event.preventDefault();

const query=new URLSearchParams({
class:selectedClass,
board:board,
subject:subject,
chapter:chapter,
number:number
});

location.replace("chapter.html?"+query.toString());
};
  
const chapter1 = `
<h2>Chapter 1: Electric Charges and Fields</h2>

<h3>1. Introduction to Electric Charge</h3>
<p>Electric charge is a basic property of matter due to which particles experience electrical force.</p>
<p><b>Definition (Exam):</b> Electric charge is the fundamental property of matter responsible for electrical interactions.</p>

<h3>2. Types of Electric Charges</h3>
<ul>
<li>Positive Charge (+): Found on protons.</li>
<li>Negative Charge (-): Found on electrons.</li>
</ul>
<p>Like charges repel each other, whereas unlike charges attract each other.</p>

<h3>3. Properties of Electric Charge</h3>
<p><b>(a) Additivity:</b> Total charge is the algebraic sum of individual charges.</p>
<p><b>(b) Conservation:</b> Electric charge can neither be created nor destroyed; it can only be transferred.</p>
<p><b>(c) Quantisation:</b> Charge exists in integral multiples of elementary charge.</p>
<p class="formula"><b>Formula:</b> q = ne</p>
<ul>
<li>q = total charge</li>
<li>n = integer</li>
<li>e = 1.6 × 10⁻¹⁹ C</li>
</ul>

<h3>4. Conductors and Insulators</h3>
<p><b>Conductors:</b> Materials in which electric charges can move freely. Examples: Copper, aluminium.</p>
<p><b>Insulators:</b> Materials in which electric charges cannot move freely. Examples: Rubber, glass.</p>

<h3>5. Coulomb's Law</h3>
<p><b>Statement:</b> The electrostatic force between two stationary point charges is directly proportional to the product of their charges and inversely proportional to the square of the distance between them.</p>
<p><b>Formula:</b></p>
<p class="formula">F = (1 / 4πε₀) × |q₁q₂| / r²</p>
<p>Or, F = k |q₁q₂| / r²</p>
<ul>
<li>F = Electrostatic force (N)</li>
<li>q₁, q₂ = Charges (C)</li>
<li>r = Distance (m)</li>
<li>k = 9 × 10⁹ N m²/C² (approximately, in vacuum)</li>
</ul>

<h3>6. Principle of Superposition</h3>
<p>When several charges act on a charge, the net force is the vector sum of the individual forces.</p>
<p class="formula">Fnet = F₁ + F₂ + F₃ + ...</p>

<h3>7. Electric Field</h3>
<p>Electric field is the region around a charge in which another charge experiences an electric force.</p>
<p><b>Definition (Exam):</b> Electric field at a point is the force experienced per unit positive test charge placed at that point.</p>
<p class="formula">E = F/q₀</p>
<p>SI Unit: N/C or V/m</p>
<p>For a point charge:</p>
<p class="formula">E = (1 / 4πε₀) × |Q| / r²</p>

<h3>8. Electric Field Lines</h3>
<ul>
<li>Field lines start from positive charges and end at negative charges.</li>
<li>Two electric field lines never intersect.</li>
<li>Closer lines indicate a stronger electric field.</li>
<li>Field lines are perpendicular to the surface of a conductor in electrostatic equilibrium.</li>
</ul>

<h3>9. Electric Dipole</h3>
<p>An electric dipole consists of two equal and opposite charges separated by a small distance.</p>
<p><b>Dipole Moment:</b></p>
<p class="formula">p = q × 2a</p>
<ul>
<li>q = magnitude of either charge</li>
<li>2a = separation between charges</li>
<li>Direction: Negative to positive charge</li>
</ul>
<p>SI Unit: C m</p>

<h3>10. Electric Flux</h3>
<p>Electric flux measures the number of electric field lines passing through a surface.</p>
<p class="formula">Φ = EA cos θ</p>
<p>For a non-uniform field, flux is expressed as the surface integral of the electric field.</p>
<p>SI Unit: N m²/C</p>

<h3>11. Gauss's Law</h3>
<p><b>Statement:</b> The total electric flux through any closed surface is equal to 1/ε₀ times the total charge enclosed by that surface.</p>
<p><b>Formula:</b></p>
<p class="formula">Φ = q(enclosed) / ε₀</p>
<p class="formula">∮ E · dA = q(enclosed)/ε₀</p>

<h3>12. Applications of Gauss's Law</h3>
<p><b>(a) Infinite Straight Charged Wire:</b></p>
<p class="formula">E = λ / (2πε₀r)</p>
<p>λ = Linear charge density</p>

<p><b>(b) Infinite Plane Sheet:</b></p>
<p class="formula">E = σ / (2ε₀)</p>
<p>σ = Surface charge density</p>

<p><b>(c) Charged Spherical Shell:</b></p>
<p>Outside the shell:</p>
<p class="formula">E = (1 / 4πε₀) × Q/r²</p>
<p>Inside the shell:</p>
<p class="formula">E = 0</p>

<h3>13. Important Constants</h3>
<ul>
<li>Elementary charge = 1.6 × 10⁻¹⁹ C</li>
<li>Permittivity of free space (ε₀) = 8.854 × 10⁻¹² C²/N m²</li>
<li>Coulomb constant (k) ≈ 9 × 10⁹ N m²/C²</li>
</ul>

<h3>14. Solved Numerical</h3>
<p><b>Question:</b> Two charges of 2 μC and 3 μC are separated by 0.3 m in vacuum. Find the electrostatic force.</p>
<p><b>Given:</b></p>
<ul>
<li>q₁ = 2 × 10⁻⁶ C</li>
<li>q₂ = 3 × 10⁻⁶ C</li>
<li>r = 0.3 m</li>
<li>k = 9 × 10⁹ N m²/C²</li>
</ul>
<p><b>Using Coulomb's Law:</b></p>
<p>F = k |q₁q₂| / r²</p>
<p>F = (9 × 10⁹ × 2 × 10⁻⁶ × 3 × 10⁻⁶) / (0.3)²</p>
<p><b>Answer: F = 0.6 N</b></p>

<h3>15. Practice Questions</h3>
<ol>
<li>Define electric charge.</li>
<li>State Coulomb's law and write its mathematical expression.</li>
<li>Explain the conservation of electric charge.</li>
<li>Define electric dipole moment and give its SI unit.</li>
<li>What is electric flux?</li>
<li>State Gauss's law.</li>
<li>Derive the electric field due to an infinitely long straight charged wire using Gauss's law.</li>
</ol>

<div class="notice">
<b>Important:</b> These are introductory chapter notes. Full derivations, diagrams, board PYQs and additional numerical practice still need to be added.
</div>
`;

const content=document.getElementById("bookContent");

if(subject==="Physics" && number===1){
content.innerHTML=chapter1;
}else{
content.innerHTML=`
<h2>Chapter ${number}: ${chapter}</h2>
<p>Detailed notes for this chapter are being prepared.</p>
<div class="notice">This chapter's complete notes will be added separately.</div>
`;
}
</script>
</body>
</html>
