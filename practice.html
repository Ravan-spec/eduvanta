<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>EDUVANTA | Practice Arena</title>

<style>
:root{
  --bg:#0b1020;
  --surface:#131d33;
  --surface2:#202c47;
  --border:#293a59;
  --text:#f4f7ff;
  --muted:#a5b2ca;
  --blue:#7895ff;
  --teal:#36d6c3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  line-height:1.7;
  min-height:100vh;
}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#101a30ee;
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:900px;
  margin:auto;
  padding:13px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font-size:21px;
  font-weight:800;
}
.logo span{color:var(--teal)}
.back{
  background:var(--surface2);
  border:1px solid var(--border);
  color:white;
  padding:9px 13px;
  border-radius:9px;
  font-size:13px;
}
main{
  max-width:800px;
  margin:auto;
  padding:25px 5% 65px;
}
.hero{
  padding:25px 22px;
  border:1px solid var(--border);
  border-radius:18px;
  background:
    radial-gradient(circle at 90% 10%,#3458a566,transparent 35%),
    linear-gradient(135deg,#172747,#102c4d 65%,#123c51);
}
.tag{
  display:inline-block;
  color:var(--teal);
  background:#ffffff15;
  padding:6px 11px;
  border-radius:30px;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:12px;
}
.hero h1{
  font-size:clamp(25px,5vw,34px);
  line-height:1.3;
  margin-bottom:9px;
}
.muted{color:var(--muted);font-size:13px}
.course-tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}
.course-tags span{
  background:#ffffff15;
  border:1px solid #ffffff20;
  border-radius:8px;
  padding:7px 10px;
  font-size:11px;
}
.panel{
  margin-top:20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px;
}
.progress-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
#questionCount{font-size:13px;color:var(--muted)}
#progressPercent{font-size:13px;color:var(--teal);font-weight:bold}
.progress{
  height:8px;
  background:#293653;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:23px;
}
.progress-bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--blue),var(--teal));
  border-radius:20px;
  transition:width .3s;
}
.question-label{
  font-size:11px;
  color:var(--teal);
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:9px;
}
#question{
  font-size:21px;
  line-height:1.5;
  margin-bottom:20px;
}
.option{
  display:block;
  width:100%;
  text-align:left;
  margin:11px 0;
  padding:14px 15px;
  background:var(--surface2);
  color:white;
  border:1px solid #344568;
  border-radius:11px;
  font-size:15px;
  line-height:1.6;
  transition:border-color .2s,background .2s;
}
.option:not(:disabled):active{
  border-color:var(--teal);
}
.option:disabled{cursor:default;opacity:1}
.option.correct{
  border-color:#39c98a;
  background:#153b34;
}
.option.wrong{
  border-color:#f07878;
  background:#44272e;
}
#feedback{
  margin-top:17px;
  padding:14px;
  border-radius:10px;
  font-size:13px;
  line-height:1.8;
  display:none;
}
#feedback.success{
  display:block;
  background:#153b34;
  border:1px solid #287b5b;
  color:#a9f3ce;
}
#feedback.error{
  display:block;
  background:#44272e;
  border:1px solid #87434b;
  color:#ffc0c0;
}
.next{
  margin-top:20px;
  padding:12px 18px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#637ee8,#5268c9);
  color:white;
  font-size:14px;
  font-weight:bold;
}
.next:disabled{opacity:.4;cursor:not-allowed}
.score-line{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
}
.result{
  text-align:center;
  padding:15px 5px;
}
.result-icon{font-size:53px;margin-bottom:10px}
.result h2{
  color:var(--teal);
  font-size:27px;
  margin-bottom:8px;
}
.result-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:23px;
}
.result-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}
.result-card{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 7px;
}
.result-card strong{
  display:block;
  font-size:24px;
  color:var(--teal);
}
.result-card span{
  font-size:11px;
  color:var(--muted);
}
.result-message{
  background:#172747;
  border:1px solid var(--border);
  border-radius:11px;
  padding:14px;
  font-size:13px;
  margin:18px 0;
}
footer{
  border-top:1px solid var(--border);
  text-align:center;
  padding:24px 5%;
  color:var(--muted);
  font-size:12px;
}
@media(max-width:500px){
  main{padding:18px 4% 50px}
  .hero{padding:21px 17px}
  .panel{padding:15px}
  #question{font-size:19px}
  .option{font-size:14px;padding:13px}
  .result-card strong{font-size:21px}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">EDU<span>VANTA</span></a>
    <a class="back" id="backButton" href="#">← Learning Modes</a>
  </div>
</header>

<main>

<section class="hero">
  <div class="tag">EDUVANTA PRACTICE ARENA</div>
  <h1 id="pageTitle">Practice Mode</h1>
  <p class="muted">Test your understanding. Learn from mistakes. Improve your accuracy.</p>

  <div class="course-tags">
    <span id="boardInfo"></span>
    <span id="classInfo"></span>
    <span id="subjectInfo"></span>
    <span id="chapterInfo"></span>
  </div>
</section>

<section class="panel" id="practicePanel">

  <div class="progress-top">
    <span id="questionCount">Question 1 of 10</span>
    <span id="progressPercent">0%</span>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="question-label" id="questionLabel">QUESTION 01</div>

  <h2 id="question"></h2>

  <div id="options"></div>

  <div id="feedback" role="status" aria-live="polite"></div>

  <button class="next" id="nextButton" disabled>
    Next Question →
  </button>

  <div class="score-line">
    <span id="correctCount">Correct: 0</span>
    <span id="attemptCount">Attempted: 0</span>
  </div>

</section>

</main>

<footer>
  <strong>EDUVANTA — Learn Beyond Limits.</strong><br>
  Practice makes progress.
</footer>

<script>

/* PAGE DETAILS */

const params = new URLSearchParams(location.search);

const selectedClass = params.get("class") || "Class 12";
const board = params.get("board") || "CBSE";
const subject = params.get("subject") || "Physics";
const chapter = params.get("chapter") || "Electric Charges and Fields";
const number = params.get("number") || "1";

document.getElementById("boardInfo").textContent = board;
document.getElementById("classInfo").textContent = selectedClass;
document.getElementById("subjectInfo").textContent = subject;
document.getElementById("chapterInfo").textContent = "Chapter " + number;

document.getElementById("pageTitle").textContent =
  chapter + " — Practice";

/* BACK NAVIGATION */

const backQuery = new URLSearchParams({
  class:selectedClass,
  board:board,
  subject:subject,
  chapter:chapter,
  number:number
});

document.getElementById("backButton").href =
  "chapter.html?" + backQuery.toString();

/* PHYSICS CHAPTER 1 QUESTIONS */

const physicsQuestions = [

{
q:"What is the SI unit of electric charge?",
options:["Newton","Coulomb","Volt","Ampere"],
answer:1,
explanation:"Electric charge ka SI unit Coulomb (C) hai."
},

{
q:"Which particles carry a positive charge?",
options:["Electrons","Neutrons","Protons","Photons"],
answer:2,
explanation:"Protons carry positive electric charge."
},

{
q:"What happens between two like charges?",
options:["Attraction","Repulsion","No force","Fusion"],
answer:1,
explanation:"Like charges repel each other."
},

{
q:"What is the value of elementary charge?",
options:[
"1.6 × 10⁻¹⁹ C",
"9 × 10⁹ C",
"8.85 × 10⁻¹² C",
"1.6 × 10⁻⁹ C"
],
answer:0,
explanation:"Elementary charge ka magnitude 1.6 × 10⁻¹⁹ C hai."
},

{
q:"Which principle states that total charge remains conserved?",
options:[
"Superposition",
"Conservation of charge",
"Quantisation",
"Coulomb's law"
],
answer:1,
explanation:"Total electric charge is conserved; it is neither created nor destroyed."
},

{
q:"What is the formula for quantisation of charge?",
options:[
"F = ma",
"q = ne",
"V = IR",
"E = mc²"
],
answer:1,
explanation:"Charge is q = ne, where n is an integer."
},

{
q:"What is the SI unit of electric field?",
options:["N/C","C/N","J/C","N m"],
answer:0,
explanation:"Electric field ka SI unit Newton per Coulomb (N/C) hai."
},

{
q:"In which direction is an electric dipole moment?",
options:[
"Positive to negative",
"Negative to positive",
"Always upward",
"No direction"
],
answer:1,
explanation:"Dipole moment direction negative charge se positive charge ki taraf hoti hai."
},

{
q:"Which law gives the force between two stationary point charges?",
options:[
"Ohm's law",
"Gauss's law",
"Coulomb's law",
"Faraday's law"
],
answer:2,
explanation:"Coulomb's law describes electrostatic force between point charges."
},

{
q:"What is the SI unit of electric flux?",
options:[
"N/C",
"N m²/C",
"C m",
"J/C"
],
answer:1,
explanation:"Electric flux ka SI unit N m²/C hai."
}

];

/* CONTENT AVAILABILITY */

const isPhysicsChapter1 =
  subject === "Physics" &&
  number === "1" &&
  chapter === "Electric Charges and Fields";

const questions = isPhysicsChapter1 ? physicsQuestions : [];

/* ELEMENTS */

let current = 0;
let totalCorrect = 0;
let attempted = 0;
let answered = false;
let completed = false;
let userAnswers = [];

const questionElement = document.getElementById("question");
const optionsElement = document.getElementById("options");
const feedbackElement = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");
const questionCount = document.getElementById("questionCount");
const scoreCorrect = document.getElementById("correctCount");
const scoreAttempt = document.getElementById("attemptCount");
const progressBar = document.getElementById("progressBar");
const progressPercent = document.getElementById("progressPercent");
const questionLabel = document.getElementById("questionLabel");
const practicePanel = document.getElementById("practicePanel");

/* UPDATE SCORE */

function updateScore(){

  scoreCorrect.textContent =
    "Correct: " + totalCorrect;

  scoreAttempt.textContent =
    "Attempted: " + attempted;

}

/* UPDATE PROGRESS */

function updateProgress(){

  const percentage = Math.round(
    (current / questions.length) * 100
  );

  progressBar.style.width = percentage + "%";
  progressPercent.textContent = percentage + "%";

}

/* SHOW QUESTION */

function showQuestion(){

  answered = false;

  feedbackElement.className = "";
  feedbackElement.style.display = "none";
  feedbackElement.textContent = "";

  nextButton.disabled = true;
  nextButton.textContent = "Next Question →";

  const item = questions[current];

  questionElement.textContent = item.q;

  questionLabel.textContent =
    "QUESTION " + String(current + 1).padStart(2,"0");

  questionCount.textContent =
    "Question " + (current + 1) + " of " + questions.length;

  optionsElement.innerHTML = "";

  item.options.forEach((option,index)=>{

    const button = document.createElement("button");

    button.className = "option";
    button.type = "button";

    button.textContent =
      String.fromCharCode(65 + index) + ". " + option;

    button.addEventListener("click",()=>{
      checkAnswer(index);
    });

    optionsElement.appendChild(button);

  });

  updateProgress();
  updateScore();

}

/* CHECK ANSWER */

function checkAnswer(selected){

  if(answered || completed)return;

  answered = true;
  attempted++;

  const item = questions[current];
  const buttons = optionsElement.querySelectorAll(".option");

  buttons.forEach((button,index)=>{

    button.disabled = true;

    if(index === item.answer){
      button.classList.add("correct");
    }

    if(index === selected && selected !== item.answer){
      button.classList.add("wrong");
    }

  });

  if(selected === item.answer){

    totalCorrect++;

    feedbackElement.className = "success";

    feedbackElement.textContent =
      "✓ Correct Answer! " + item.explanation;

  }else{

    feedbackElement.className = "error";

    feedbackElement.textContent =
      "✕ Incorrect Answer. Correct answer: " +
      item.options[item.answer] + ". " +
      item.explanation;

  }

  userAnswers.push({
    question:item.q,
    selected:selected,
    correct:item.answer,
    isCorrect:selected === item.answer
  });

  feedbackElement.style.display = "block";

  nextButton.disabled = false;

  nextButton.textContent =
    current === questions.length - 1
    ? "View Result ✓"
    : "Next Question →";

  updateScore();

}

/* FINISH PRACTICE */

function finishPractice(){

  completed = true;

  const total = questions.length;

  const accuracy = total > 0
    ? Math.round((totalCorrect / total) * 100)
    : 0;

  const wrong = attempted - totalCorrect;
  const skipped = total - attempted;

  let message = "";

  if(accuracy >= 80){
    message = "You have demonstrated a strong understanding of these questions. Keep practising.";
  }else if(accuracy >= 50){
    message = "You have a foundation to build on. Revise incorrect answers and practise again.";
  }else{
    message = "Revisit the chapter concepts and formulas before attempting the test again.";
  }

  questionLabel.textContent = "YOUR PERFORMANCE";

  questionElement.textContent = "Practice Completed!";

  optionsElement.innerHTML = "";

  feedbackElement.style.display = "none";

  practicePanel.innerHTML = `
    <div class="result">
      <div class="result-icon">🏆</div>
      <h2>Test Completed!</h2>
      <p class="result-subtitle">
        Your performance in ${total} practice questions
      </p>

      <div class="result-grid">
        <div class="result-card">
          <strong>${totalCorrect}/${total}</strong>
          <span>Correct</span>
        </div>

        <div class="result-card">
          <strong>${accuracy}%</strong>
          <span>Accuracy</span>
        </div>

        <div class="result-card">
          <strong>${attempted}</strong>
          <span>Attempted</span>
        </div>
      </div>

      <div class="result-grid">
        <div class="result-card">
          <strong>${wrong}</strong>
          <span>Incorrect</span>
        </div>

        <div class="result-card">
          <strong>${skipped}</strong>
          <span>Skipped</span>
        </div>

        <div class="result-card">
          <strong>${total}</strong>
          <span>Total</span>
        </div>
      </div>

      <div class="result-message">
        ${message}
      </div>

      <button class="next" id="restartButton">
        ↻ Restart Practice
      </button>
    </div>
  `;

  progressBar.style.width = "100%";
  progressPercent.textContent = "100%";
  questionCount.textContent = "All questions completed";

  document.getElementById("restartButton")
    .addEventListener("click",restartPractice);

  window.scrollTo({top:0,behavior:"smooth"});

}

/* NEXT QUESTION */

function nextQuestion(){

  if(!answered || completed)return;

  if(current < questions.length - 1){

    current++;

    showQuestion();

    window.scrollTo({top:0,behavior:"smooth"});

  }else{

    finishPractice();

  }

}

/* RESTART */

function restartPractice(){

  current = 0;
  totalCorrect = 0;
  attempted = 0;
  answered = false;
  completed = false;
  userAnswers = [];

  practicePanel.innerHTML = `
    <div class="progress-top">
      <span id="questionCount">Question 1 of ${questions.length}</span>
      <span id="progressPercent">0%</span>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-label" id="questionLabel">QUESTION 01</div>

    <h2 id="question"></h2>

    <div id="options"></div>

    <div id="feedback" role="status" aria-live="polite"></div>

    <button class="next" id="nextButton" disabled>
      Next Question →
    </button>

    <div class="score-line">
      <span id="correctCount">Correct: 0</span>
      <span id="attemptCount">Attempted: 0</span>
    </div>
  `;

  location.reload();

}

/* NEXT BUTTON */

nextButton.addEventListener("click",nextQuestion);

/* INITIAL LOAD */

if(questions.length === 0){

  questionLabel.textContent = "CONTENT NOT AVAILABLE";

  questionElement.textContent =
    "Practice questions are being prepared for this chapter.";

  optionsElement.innerHTML = "";

  questionCount.textContent = "Coming Soon";

  feedbackElement.style.display = "block";
  feedbackElement.textContent =
    "Please check back later for chapter-specific questions.";

  feedbackElement.className = "success";

  nextButton.style.display = "none";

  scoreCorrect.textContent = "";
  scoreAttempt.textContent = "";

}else{

  showQuestion();

}

</script>

</body>
</html>
